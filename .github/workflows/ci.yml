name: FinSight CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: finsight-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic check
        working-directory: backend
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:build-tools
      - run: npm audit --audit-level=moderate

  android-build:
    needs: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Prepare persistent release signing on main
        env:
          KEYSTORE_BASE64: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.FINSIGHT_ANDROID_KEYSTORE_BASE64 || '' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finsight-release.p12"
            chmod 600 "$RUNNER_TEMP/finsight-release.p12"
            printf 'FINSIGHT_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/finsight-release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build and verify a signed 64-bit release APK
        env:
          FINSIGHT_GRADLE_WORKERS: 2
          FINSIGHT_KEY_ALIAS: finsight
          FINSIGHT_STORE_PASSWORD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.FINSIGHT_ANDROID_STORE_PASSWORD || '' }}
        run: npm run build:android
      - uses: actions/upload-artifact@v4
        with:
          name: android-validation-apk
          path: |
            mobile/artifacts/*.apk
            mobile/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  android-native:
    needs: android-build
    uses: ./.github/workflows/android-native.yml
    with:
      apk-run-id: ${{ format('{0}', github.run_id) }}

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete Compose stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Verify the frontend and authenticated financial API
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://localhost:3000/ -o /tmp/finsight-home.html
          grep -q "FinSight" /tmp/finsight-home.html
          curl --fail --silent --show-error http://localhost:8000/health | jq -e '.status == "ok"'
          token=$(curl --fail --silent --show-error http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@finsight.ai","password":"Demo1234!"}' | jq -er '.access_token')
          curl --fail --silent --show-error http://localhost:8000/api/analytics/overview \
            -H "Authorization: Bearer $token" | jq -e '.kpis.revenue >= 0 and .kpis.expenses >= 0'
          curl --fail --silent --show-error 'http://localhost:8000/api/forecasts/cash-flow?horizon=7' \
            -H "Authorization: Bearer $token" | jq -e '.days | length == 7'
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
