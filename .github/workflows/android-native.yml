name: Android native APK verification

on:
  workflow_call:
    inputs:
      apk-run-id:
        description: FinSight CI run containing a successful signed APK build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      apk-run-id:
        description: FinSight CI run containing a successful signed APK build
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - name: Verify the artifact's application source matches this checkout
        env:
          GH_TOKEN: ${{ github.token }}
          APK_RUN_ID: ${{ inputs.apk-run-id }}
        shell: bash
        run: |
          retry_gh_api() {
            for attempt in 1 2 3; do
              if gh api "$@"; then return 0; fi
              sleep "$((attempt * 3))"
            done
            return 1
          }
          # Job-only reruns can omit the original build from the latest attempt.
          # Check all attempts/pages for a successful build of this run's source.
          test "$(retry_gh_api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID/jobs?filter=all&per_page=100" --paginate --slurp | jq -r 'any(.[].jobs[]; .name == "android-build" and .conclusion == "success")')" = true
          apk_sha=$(retry_gh_api "repos/$GITHUB_REPOSITORY/actions/runs/$APK_RUN_ID" --jq .head_sha)
          git fetch --no-tags --depth=1 origin "$apk_sha"
          git diff --exit-code "$apk_sha" HEAD -- mobile \
            ':!mobile/scripts/verify-android.py' ':!mobile/tests' ':!mobile/README.md' \
            ':!mobile/jest.config.cjs' ':!mobile/scripts/configure-ci-signing.cjs'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: android-validation-apk
          path: mobile/artifacts
          run-id: ${{ inputs.apk-run-id }}
          github-token: ${{ github.token }}
      - name: Verify the downloaded APK checksum
        working-directory: mobile/artifacts
        run: sha256sum --check FinSight-AI-1.1.0.apk.sha256
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the real signed APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          cores: 4
          ram-size: 2048M
          heap-size: 256M
          enable-hw-keyboard: true
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: python mobile/scripts/verify-android.py --apk mobile/artifacts/FinSight-AI-1.1.0.apk --output mobile/artifacts/verification-api-${{ matrix.api-level }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-verification-api-${{ matrix.api-level }}
          path: mobile/artifacts/verification-api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14
